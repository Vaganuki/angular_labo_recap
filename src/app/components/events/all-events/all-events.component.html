<div class="window" [class.fullscreen]="isFullscreen">
  <div class="titleBar">
    <div class="title">
      <div>View All Events</div>
    </div>
    <div class="b">
      <!--            <div class="titleButton"> _</div>-->
      <!--      <div class="titleButton" (click)="toggleFullscreen()"> | | </div>-->
      <div class="titleButton" [routerLink]="['/']" (click)="close()">X</div>
    </div>
  </div>
  <div class="windowContent">
    <div class="titleMenu">
      List of events
    </div>
    <div class="containerAll">
      <div class="search">
        <input
          type="text"
          [(ngModel)]="searchValue"
          placeholder="Rechercher un événement..."
        />
        <button (click)="SearchInput() ; clic()">Search</button>
      </div>
      <div class="affichageAll">
        <ul>
          @for (event of filteredEvents(); track event.id) {
            <li
              [class.selected]="event.id === selectedEvents?.id"
              (click)="selectEvent1(event)"
            >
              {{ event.name }}
            </li>
          }
        </ul>
      </div>
      <div class="button-option">
        <button
          (click)="participate() ; clic()"
          [disabled]="!selectedEvents || joinedEvents.has(selectedEvents.id)"
        >
          Participer
        </button>

        <button [disabled]="!selectedEvents" (click)="sharing() ; clic()">Partage</button>
        <button class="button"
                (click)="clic()"
                [routerLink]="selectedEvents ? ['/events/property', selectedEvents.id] : null"
                [state]="{ from: 'events' }"
                [disabled]="!selectedEvents">
          Propriétés
        </button>
        <button [routerLink]="['/create-event']" (click)="clic()">Créer un event</button>
      </div>
    </div>

  </div>
  <div class="button-principale">
    <button class="button" [routerLink]="['/']" (click)="close()">OK</button>
    <button class="button" [routerLink]="['/']" (click)="close()">Cancel</button>
  </div>
</div>

<div class="childComponent">
  <router-outlet></router-outlet>
</div>
