<div class="window">
  <div class="titleBar">
    <div class="title">Votre profil</div>
    <div>
<!--      <div class="titleButton">?</div>-->
      <div [routerLink]="['/']" (click)="close()" class="titleButton">X</div>
    </div>
  </div>

  <div class="windowContent">

    <div class="mainMenu">
      <button class="menuButton" [routerLink]="['/profil']">Utilisateur</button>
      <button disabled class="menuButton" [routerLink]="['/event-user']">Évènement</button>
    </div>

    <div class="eventContainer">
      <div class="listContainer">
        <ul *ngIf="participations.length; else noEvent" class="colored-square">
          <li *ngFor="let participation of participations; let i = index"
              [class.active]="participation.isActive"
              (click)="selectEvent(i)">
            <div class="eventList">
              {{ participation.event?.name }}
            </div>
          </li>
        </ul>
      </div>
      <ng-template #noEvent>
        <p>Aucun événement trouvé.</p>
      </ng-template>

    </div>

    <div class="eventActions">
      <button class="button"
              [routerLink]="selectedEventId ? ['/event-user/property', selectedEventId] : null"
              [state]="{ from: 'event-user' }"
              [disabled]="!selectedEventId">
        Propriétés
      </button>
    </div>

    <div class="eventButtons">
      <button [routerLink]="['/']">OK</button>
      <button [routerLink]="['/']">Annuler</button>
    </div>

    <div class="childComponent">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
